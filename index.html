<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂抓魚小遊戲（文字配對）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background-color: #1a237e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 960px;
            height: 640px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            border: 4px solid #00838f;
            cursor: default;
        }

        /* 自訂滑鼠抓取手勢 */
        .grabbing-cursor, .grabbing-cursor * {
            cursor: url('grab.jpg'), pointer !important;
        }

        /* 通用頁面 */
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #cover-screen {
            background-image: url('cover_bg.jpg');
            background-color: #b2ebf2;
        }

        #setting-screen {
            background-image: url('cover_bg.jpg');
            background-color: #80deea;
        }

        #game-screen {
            background-image: url('game_bg.jpg');
            background-color: #4dd0e1;
            justify-content: flex-start;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 52px;
            color: #ffffff;
            margin-bottom: 35px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.7), 0 0 10px #006064;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 20px;
        }

        .btn {
            padding: 15px 45px;
            font-size: 26px;
            font-weight: bold;
            color: white;
            background: linear-gradient(180deg, #26c6da 0%, #00acc1 100%);
            border: 3px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            margin: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        .btn:hover {
            transform: scale(1.08);
            background: linear-gradient(180deg, #4dd0e1 0%, #00838f 100%);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* 設定頁面 */
        .setting-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 40px;
            border-radius: 20px;
            width: 85%;
            max-height: 88%;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 3px solid #00acc1;
        }

        .setting-item {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .setting-item label {
            font-size: 18px;
            font-weight: bold;
            color: #006064;
            margin-bottom: 6px;
        }

        .setting-item input, .setting-item select, .setting-item textarea {
            width: 100%;
            padding: 8px 12px;
            font-size: 16px;
            border: 2px solid #80deea;
            border-radius: 10px;
            outline: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: #006064;
        }

        .checkbox-label input {
            width: 22px;
            height: 22px;
            margin-right: 10px;
            cursor: pointer;
        }

        /* 頂部資訊列 */
        #game-header {
            width: 100%;
            height: 160px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            border-bottom: 3px dashed rgba(255,255,255,0.6);
            position: relative;
        }

        .info-panel {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 計數量牌子區塊 */
        .counter-card {
            position: relative;
            width: 130px;
            height: 95px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .counter-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        .counter-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #004d40;
            font-weight: bold;
        }

        .counter-title {
            font-size: 15px;
            color: #006064;
            text-shadow: 1px 1px 0px #fff;
        }

        .counter-value {
            font-size: 32px;
            color: #d84315;
            text-shadow: 1px 1px 0px #fff;
            line-height: 1;
        }

        /* 籃子區塊與反饋圖案 */
        .basket-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .basket-container {
            position: relative;
            width: 180px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .basket-container.drag-over {
            transform: scale(1.15);
        }

        .basket-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        .basket-text {
            position: relative;
            z-index: 2;
            font-size: 52px;
            font-weight: 900;
            color: #d84315;
            text-shadow: 3px 3px 0px #ffffff, -2px -2px 0px #ffffff, 2px -2px 0px #ffffff, -2px 2px 0px #ffffff;
            margin-top: -10px;
        }

        .target-hint {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 96, 100, 0.7);
            padding: 2px 12px;
            border-radius: 12px;
            margin-top: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .feedback-icon {
            position: absolute;
            right: -60px;
            top: 20px;
            width: 60px;
            height: 60px;
            object-fit: contain;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        .feedback-icon.show {
            opacity: 1;
            transform: scale(1.2);
        }

        /* 海洋區域 */
        #ocean {
            width: 100%;
            height: 480px;
            position: relative;
            overflow: hidden;
        }

        /* 小魚物件 */
        .fish-wrapper {
            position: absolute;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            touch-action: none;
        }

        .fish-wrapper.dragging {
            z-index: 100;
            opacity: 0.9;
            transform: scale(1.1) !important;
            transition: none !important;
        }

        .fish-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .fish-text {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 5px #000000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
        }

        .swim-left .fish-img {
            transform: scaleX(-1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 封面頁 -->
    <div id="cover-screen" class="screen">
        <h1>快樂抓魚小遊戲（文字配對）</h1>
        <button class="btn" onclick="startGame()">開始遊戲</button>
        <button class="btn" style="background: linear-gradient(180deg, #0288d1 0%, #01579b 100%);" onclick="showScreen('setting-screen')">遊戲設定</button>
    </div>

    <!-- 設定頁 -->
    <div id="setting-screen" class="screen hidden">
        <div class="setting-box">
            <h2 style="color: #006064; margin-bottom: 15px; text-align: center;">遊戲設定</h2>
            
            <div class="setting-item">
                <label for="game-time">遊戲時限（秒）：</label>
                <input type="number" id="game-time" value="60" min="10" max="300">
            </div>

            <div class="setting-item">
                <label for="fish-count">海洋中魚的數量：</label>
                <input type="number" id="fish-count" value="6" min="3" max="12">
            </div>

            <div class="setting-item">
                <label for="fish-size">魚的尺寸：</label>
                <select id="fish-size">
                    <option value="90">小 (90px)</option>
                    <option value="120" selected>中 (120px)</option>
                    <option value="150">大 (150px)</option>
                    <option value="180">特大 (180px)</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="fish-speed">魚移動速度：</label>
                <select id="fish-speed">
                    <option value="0.3">極慢</option>
                    <option value="0.6">慢</option>
                    <option value="1.0" selected>中 (標準)</option>
                    <option value="1.8">快</option>
                </select>
            </div>

            <div class="setting-item">
                <label class="checkbox-label">
                    <input type="checkbox" id="advanced-mode">
                    開啟進階難度（混合前字與後字題型，例如：「__心」或「開__」）
                </label>
            </div>

            <div class="setting-item">
                <label for="correct-fish-mode">正確答案魚的數量：</label>
                <select id="correct-fish-mode">
                    <option value="1">固定 1 條正確</option>
                    <option value="2">固定 2 條正確</option>
                    <option value="random" selected>隨機多條正確 (1~3 條)</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="word-list">配對詞語題庫（請用逗號「,」或換行分隔）：</label>
                <textarea id="word-list" rows="3">開心, 朋友, 學習, 太陽, 快樂, 學校, 努力, 成功</textarea>
            </div>

            <!-- 新增：自訂額外干擾字 -->
            <div class="setting-item">
                <label for="custom-wrong-chars">額外錯字／干擾字（可選，請用逗號「,」或空格分隔）：</label>
                <input type="text" id="custom-wrong-chars" placeholder="例如：木, 本, 休, 未, 末（會與預設字庫合併產生）">
            </div>

            <div style="text-align: center; margin-top: 10px;">
                <button class="btn" onclick="saveSettings()">儲存並返回</button>
            </div>
        </div>
    </div>

    <!-- 遊戲頁面 -->
    <div id="game-screen" class="screen hidden">
        <div id="game-header">
            <div class="info-panel">
                <div>時間: <span id="timer">60</span> 秒</div>
                <div>得分: <span id="score">0</span></div>
            </div>

            <div class="basket-wrapper">
                <div id="basket" class="basket-container">
                    <img src="basket.jpg" alt="籃子" class="basket-img" onerror="this.style.display='none'">
                    <div id="target-word" class="basket-text">開__</div>
                </div>
                <div id="target-hint" class="target-hint">剩餘正確：1 條</div>
                
                <img id="feedback-correct" src="correct.jpg" class="feedback-icon" alt="正確" onerror="this.style.display='none'">
                <img id="feedback-wrong" src="wrong.jpg" class="feedback-icon" alt="錯誤" onerror="this.style.display='none'">
            </div>

            <div class="counter-card">
                <img src="card.jpg" alt="牌子" class="counter-img" onerror="this.style.display='none'">
                <div class="counter-content">
                    <div class="counter-title">抓獲答對</div>
                    <div id="correct-count" class="counter-value">0</div>
                </div>
            </div>

            <button class="btn" style="font-size: 18px; padding: 10px 25px;" onclick="endGame()">結束遊戲</button>
        </div>

        <div id="ocean"></div>
    </div>
</div>

<script>
    // --- 遊戲設定與變數 ---
    let settings = {
        time: 60,
        fishCount: 6,
        fishSize: 120,
        fishSpeedMultiplier: 1.0,
        advancedMode: false,
        correctFishMode: "random",
        words: ["開心", "朋友", "學習", "太陽", "快樂", "學校", "努力", "成功"],
        customWrongChars: []
    };

    const fishImages = [
        'fish1.jpg', 'fish2.jpg', 'fish3.jpg', 'fish4.jpg', 'fish5.jpg',
        'fish6.jpg', 'fish7.jpg', 'fish8.jpg', 'fish9.jpg', 'fish10.jpg'
    ];
    
    // 預設常見中文字庫
    const defaultRandomChars = ["月", "日", "花", "草", "山", "水", "天", "地", "人", "木", "石", "風", "雨", "星", "海"];
    let combinedRandomChars = [...defaultRandomChars];

    let score = 0;
    let correctCount = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let animationFrameId = null;
    
    let currentTargetPair = { 
        word: "",
        displayPrompt: "",
        targetChar: ""
    };

    let activeFishes = [];

    // Web Audio API 音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        }
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function saveSettings() {
        const timeInput = parseInt(document.getElementById('game-time').value);
        const countInput = parseInt(document.getElementById('fish-count').value);
        const sizeInput = parseInt(document.getElementById('fish-size').value);
        const speedInput = parseFloat(document.getElementById('fish-speed').value);
        const wordsInput = document.getElementById('word-list').value;
        const customWrongInput = document.getElementById('custom-wrong-chars').value;

        if (timeInput) settings.time = timeInput;
        if (countInput) settings.fishCount = countInput;
        if (sizeInput) settings.fishSize = sizeInput;
        if (speedInput) settings.fishSpeedMultiplier = speedInput;

        settings.advancedMode = document.getElementById('advanced-mode').checked;
        settings.correctFishMode = document.getElementById('correct-fish-mode').value;

        // 解析自訂錯字
        if (customWrongInput.trim().length > 0) {
            settings.customWrongChars = customWrongInput.split(/[,\s]/)
                                                        .map(c => c.trim())
                                                        .filter(c => c.length === 1);
        } else {
            settings.customWrongChars = [];
        }

        // 合併預設字庫與自訂錯字
        combinedRandomChars = Array.from(new Set([...defaultRandomChars, ...settings.customWrongChars]));

        const parsedWords = wordsInput.split(/[,\n]/)
                                      .map(w => w.trim())
                                      .filter(w => w.length === 2);
        
        if (parsedWords.length > 0) {
            settings.words = parsedWords;
        } else {
            alert("請至少輸入一個雙字詞語（如：開心）");
            return;
        }

        alert("設定已儲存！");
        showScreen('cover-screen');
    }

    function startGame() {
        score = 0;
        correctCount = 0;
        timeLeft = settings.time;
        document.getElementById('score').innerText = score;
        document.getElementById('correct-count').innerText = correctCount;
        document.getElementById('timer').innerText = timeLeft;

        showScreen('game-screen');
        nextQuestion();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);

        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        gameLoop();
    }

    function nextQuestion() {
        const randomWord = settings.words[Math.floor(Math.random() * settings.words.length)];
        
        if (settings.advancedMode) {
            if (Math.random() < 0.5) {
                currentTargetPair.displayPrompt = randomWord[0] + "__";
                currentTargetPair.targetChar = randomWord[1];
            } else {
                currentTargetPair.displayPrompt = "__" + randomWord[1];
                currentTargetPair.targetChar = randomWord[0];
            }
        } else {
            currentTargetPair.displayPrompt = randomWord[0] + "__";
            currentTargetPair.targetChar = randomWord[1];
        }

        document.getElementById('target-word').innerText = currentTargetPair.displayPrompt;

        const ocean = document.getElementById('ocean');
        ocean.innerHTML = '';
        activeFishes = [];

        let numCorrect = 1;
        if (settings.correctFishMode === "2") {
            numCorrect = Math.min(2, settings.fishCount);
        } else if (settings.correctFishMode === "random") {
            const maxAllowed = Math.min(3, Math.floor(settings.fishCount / 2) || 1);
            numCorrect = Math.floor(Math.random() * maxAllowed) + 1;
        }

        const correctIndices = new Set();
        while (correctIndices.size < numCorrect) {
            correctIndices.add(Math.floor(Math.random() * settings.fishCount));
        }

        for (let i = 0; i < settings.fishCount; i++) {
            let isCorrect = correctIndices.has(i);
            spawnSingleFish(isCorrect);
        }

        updateTargetHint();
    }

    function updateTargetHint() {
        const remainingCorrect = activeFishes.filter(f => f.isCorrect).length;
        document.getElementById('target-hint').innerText = `剩餘正確：${remainingCorrect} 條`;
    }

    function spawnSingleFish(isCorrect = false) {
        const ocean = document.getElementById('ocean');
        const fishEl = document.createElement('div');
        fishEl.className = 'fish-wrapper';
        fishEl.style.width = settings.fishSize + 'px';
        fishEl.style.height = (settings.fishSize * 0.7) + 'px';

        const randomImgSrc = fishImages[Math.floor(Math.random() * fishImages.length)];
        const img = document.createElement('img');
        img.src = randomImgSrc;
        img.className = 'fish-img';
        img.onerror = function() {
            this.style.display = 'none';
            fishEl.style.backgroundColor = '#ffb74d';
            fishEl.style.borderRadius = '50%';
        };

        let fishChar = "";
        if (isCorrect) {
            fishChar = currentTargetPair.targetChar;
        } else {
            // 從合併後的字庫中抽樣
            do {
                fishChar = combinedRandomChars[Math.floor(Math.random() * combinedRandomChars.length)];
            } while (fishChar === currentTargetPair.targetChar);
        }

        const textEl = document.createElement('div');
        textEl.className = 'fish-text';
        textEl.style.fontSize = Math.round(settings.fishSize * 0.26) + 'px';
        textEl.innerText = fishChar;

        fishEl.appendChild(img);
        fishEl.appendChild(textEl);

        const direction = Math.random() < 0.5 ? 1 : -1;
        const baseSpeed = (Math.random() * 1.0 + 1.0) * settings.fishSpeedMultiplier;
        const speed = baseSpeed * direction;
        
        const oceanWidth = ocean.clientWidth;
        const oceanHeight = ocean.clientHeight;

        let startX = direction > 0 ? -settings.fishSize - (Math.random() * 100) : oceanWidth + (Math.random() * 100);
        let startY = Math.random() * (oceanHeight - settings.fishSize * 0.7 - 20) + 10;

        fishEl.style.left = startX + 'px';
        fishEl.style.top = startY + 'px';

        if (direction < 0) {
            fishEl.classList.add('swim-left');
        }

        const fishData = {
            element: fishEl,
            x: startX,
            y: startY,
            speed: speed,
            direction: direction,
            isCorrect: isCorrect,
            text: fishChar,
            isDragging: false
        };

        setupDragEvents(fishData);

        ocean.appendChild(fishEl);
        activeFishes.push(fishData);
    }

    function gameLoop() {
        const oceanWidth = document.getElementById('ocean').clientWidth;

        for (let i = activeFishes.length - 1; i >= 0; i--) {
            const fish = activeFishes[i];

            if (!fish.isDragging) {
                fish.x += fish.speed;
                fish.element.style.left = fish.x + 'px';

                let isOut = false;
                if (fish.direction > 0 && fish.x > oceanWidth + 50) isOut = true;
                if (fish.direction < 0 && fish.x < -settings.fishSize - 50) isOut = true;

                if (isOut) {
                    fish.element.remove();
                    activeFishes.splice(i, 1);
                    spawnSingleFish(fish.isCorrect);
                }
            }
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function setupDragEvents(fish) {
        const el = fish.element;
        let startMouseX, startMouseY;
        let startFishX, startFishY;

        const onPointerDown = (e) => {
            e.preventDefault();
            fish.isDragging = true;
            el.classList.add('dragging');
            document.body.classList.add('grabbing-cursor');

            const pageX = e.touches ? e.touches[0].pageX : e.pageX;
            const pageY = e.touches ? e.touches[0].pageY : e.pageY;

            startMouseX = pageX;
            startMouseY = pageY;
            startFishX = fish.x;
            startFishY = fish.y;

            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('touchend', onPointerUp);
        };

        const onPointerMove = (e) => {
            if (!fish.isDragging) return;
            if (e.touches) e.preventDefault();

            const pageX = e.touches ? e.touches[0].pageX : e.pageX;
            const pageY = e.touches ? e.touches[0].pageY : e.pageY;

            const dx = pageX - startMouseX;
            const dy = pageY - startMouseY;

            fish.x = startFishX + dx;
            fish.y = startFishY + dy;

            el.style.left = fish.x + 'px';
            el.style.top = fish.y + 'px';

            const basketEl = document.getElementById('basket');
            if (checkCollision(el, basketEl)) {
                basketEl.classList.add('drag-over');
            } else {
                basketEl.classList.remove('drag-over');
            }
        };

        const onPointerUp = (e) => {
            if (!fish.isDragging) return;
            fish.isDragging = false;
            el.classList.remove('dragging');
            document.body.classList.remove('grabbing-cursor');

            window.removeEventListener('mousemove', onPointerMove);
            window.removeEventListener('mouseup', onPointerUp);
            window.removeEventListener('touchmove', onPointerMove);
            window.removeEventListener('touchend', onPointerUp);

            const basketEl = document.getElementById('basket');
            basketEl.classList.remove('drag-over');

            if (checkCollision(el, basketEl)) {
                handleFishInBasket(fish);
            }
        };

        el.addEventListener('mousedown', onPointerDown);
        el.addEventListener('touchstart', onPointerDown, { passive: false });
    }

    function checkCollision(el1, el2) {
        const r1 = el1.getBoundingClientRect();
        const r2 = el2.getBoundingClientRect();

        return !(r1.right < r2.left || 
                 r1.left > r2.right || 
                 r1.bottom < r2.top || 
                 r1.top > r2.bottom);
    }

    function showFeedback(type) {
        const correctEl = document.getElementById('feedback-correct');
        const wrongEl = document.getElementById('feedback-wrong');

        correctEl.classList.remove('show');
        wrongEl.classList.remove('show');

        const targetEl = (type === 'correct') ? correctEl : wrongEl;
        targetEl.classList.add('show');

        setTimeout(() => {
            targetEl.classList.remove('show');
        }, 800);
    }

    function handleFishInBasket(fish) {
        if (fish.isCorrect) {
            score += 10;
            correctCount += 1;
            document.getElementById('score').innerText = score;
            document.getElementById('correct-count').innerText = correctCount;

            playSound('correct');
            showFeedback('correct');

            fish.element.remove();
            const idx = activeFishes.indexOf(fish);
            if (idx > -1) activeFishes.splice(idx, 1);

            const remainingCorrect = activeFishes.filter(f => f.isCorrect).length;
            
            if (remainingCorrect > 0) {
                updateTargetHint();
            } else {
                nextQuestion();
            }
        } else {
            timeLeft = Math.max(0, timeLeft - 3);
            document.getElementById('timer').innerText = timeLeft;

            playSound('wrong');
            showFeedback('wrong');

            fish.element.remove();
            const idx = activeFishes.indexOf(fish);
            if (idx > -1) activeFishes.splice(idx, 1);

            spawnSingleFish(false);
            updateTargetHint();
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        cancelAnimationFrame(animationFrameId);
        alert(`遊戲結束！\n總得分：${score} 分\n答對數量：${correctCount} 題`);
        showScreen('cover-screen');
    }
</script>
